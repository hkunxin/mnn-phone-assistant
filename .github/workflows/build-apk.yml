name: Build MNN Chat APK (arm64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK 27.2 & CMake 3.22.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Clone MNN
        run: git clone --depth 1 https://github.com/hkunxin/MNN.git

      # Fixed signing key (spec-002): every APK shares one signature so new
      # builds install directly over previous ones (no uninstall needed).
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          KS_STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::signing secrets missing — APK will use ephemeral debug key"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > MNN/apps/Android/MnnLlmChat/assistant-signing.jks
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/MNN/apps/Android/MnnLlmChat/assistant-signing.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KS_KEY_PASS" >> "$GITHUB_ENV"

      - name: Resolve MNN cache key
        id: mnnver
        run: echo "sha=$(git -C MNN rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache MNN core build
        id: cache-mnn
        uses: actions/cache@v5
        with:
          path: MNN/project/android/build_64
          key: mnn-arm64-${{ steps.mnnver.outputs.sha }}

      - name: Build MNN core libs (arm64-v8a, CPU+OpenCL+ARM82)
        if: steps.cache-mnn.outputs.cache-hit != 'true'
        run: |
          cd MNN/project/android
          mkdir -p build_64 && cd build_64
          ../build_64.sh "\
          -DMNN_LOW_MEMORY=true \
          -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true \
          -DMNN_BUILD_LLM=true \
          -DMNN_SUPPORT_TRANSFORMER_FUSE=true \
          -DMNN_ARM82=true \
          -DMNN_USE_LOGCAT=true \
          -DMNN_OPENCL=true \
          -DLLM_SUPPORT_VISION=true \
          -DMNN_BUILD_OPENCV=true \
          -DMNN_IMGCODECS=true \
          -DLLM_SUPPORT_AUDIO=true \
          -DMNN_BUILD_AUDIO=true \
          -DMNN_BUILD_DIFFUSION=ON \
          -DMNN_SEP_BUILD=OFF \
          -DBUILD_PLUGIN=ON \
          -DMNN_QNN=OFF \
          -DMNN_HEXAGON=OFF \
          -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384' \
          -DCMAKE_INSTALL_PREFIX=."
          make install -j4

      - name: Build MNN Chat APK (standard debug)
        run: |
          cd MNN/apps/Android/MnnLlmChat
          chmod +x gradlew
          ./gradlew assembleStandardDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: mnn-chat-debug-apk
          path: MNN/apps/Android/MnnLlmChat/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
